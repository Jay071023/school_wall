<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信公众号二维码图片</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  line-height: 1.8;
  color: #333;
  background: #f5f5f5;
  padding: 20px;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  padding: 40px 50px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
h1 { font-size: 1.8em; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #3B82F6; color: #1a1a1a; }
h2 { font-size: 1.4em; margin: 28px 0 14px; color: #2c3e50; }
h3 { font-size: 1.15em; margin: 22px 0 10px; color: #34495e; }
p { margin: 12px 0; }
ul, ol { margin: 10px 0; padding-left: 24px; }
li { margin: 6px 0; }
code {
  background: #f0f2f5;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
  color: #e74c3c;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
}
pre {
  background: #282c34;
  color: #abb2bf;
  padding: 16px 20px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 0.85em;
  line-height: 1.5;
  margin: 16px 0;
}
pre code { background: none; color: inherit; padding: 0; }
blockquote {
  border-left: 4px solid #3B82F6;
  background: #f0f7ff;
  padding: 12px 18px;
  margin: 16px 0;
  border-radius: 0 8px 8px 0;
  color: #555;
}
a { color: #3B82F6; text-decoration: none; }
a:hover { text-decoration: underline; }
table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
}
th, td {
  border: 1px solid #e0e0e0;
  padding: 8px 12px;
  text-align: left;
}
th { background: #f8f9fa; font-weight: 600; }
img { max-width: 100%; border-radius: 6px; }
hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }
</style>
</head>
<body>
<div class="container">
<h1>微信公众号二维码图片</h1>
<p>请将你的公众号二维码图片放在此目录下，并命名为 <code>wechat-qrcode.png</code></p>
<h2>获取方式：</h2>
<ol>
<li>登录微信公众平台：https://mp.weixin.qq.com</li>
<li>进入 设置与开发 → 公众号设置 → 账号详情</li>
<li>点击 下载二维码</li>
<li>将下载的图片重命名为 <code>wechat-qrcode.png</code> 并放在此目录</li>
</ol>
<h2>注意事项：</h2>
<ul>
<li>图片格式：PNG 或 JPG</li>
<li>建议尺寸：400x400 像素或更大</li>
<li>文件名称必须是 <code>wechat-qrcode.png</code></li>
</ul>
</div>
</body>
</html>
