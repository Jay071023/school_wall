<!DOCTYPE html>

<head>
  <style id="app-boot-style">
    html.app-booting { background: #f7f1e6; }
    html.app-booting body { visibility: hidden; }
  </style>
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("app-booting");
      var released = false;
      var themeReady = false;
      var hardTimeoutId = window.setTimeout(function () { release(true); }, 7000);
      function release(force) {
        if (released || (!themeReady && !force)) return;
        released = true;
        window.clearTimeout(hardTimeoutId);
        root.classList.remove("app-booting");
      }
      window.addEventListener("festival-theme-ready", function () {
        themeReady = true;
        release(false);
      }, { once: true });
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: linear-gradient(180deg, #ffffff, #f8f9fa);
      border: 1px solid #e9ecef;
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      margin-bottom: -1px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }
    .editor-btn {
      padding: 7px 14px;
      border: 1px solid #e0e3e8;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a4a4a;
      transition: all 0.2s ease;
      min-width: 40px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .editor-btn b { font-weight: 800; }
    .editor-btn:hover {
      background: linear-gradient(135deg, #f3e7ff, #ffe7f0);
      border-color: #d4b5e8;
      color: #764ba2;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(118, 75, 162, 0.15);
    }
    .editor-btn:active { transform: translateY(0); }
    .editor-btn-mark { font-size: 1rem; line-height: 1; }
    .editor-btn-label { white-space: nowrap; font-size: .8rem; }
    .editor-toolbar-hint { color: #78918c; font-size: .76rem; white-space: nowrap; }
    .word-counter {
      margin-left: auto;
      font-size: 0.82rem;
      color: #8b8b8b;
      padding: 5px 12px;
      background: rgba(118, 75, 162, 0.06);
      border-radius: 20px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .word-counter.warning { color: #dc3545; background: rgba(220, 53, 69, 0.12); font-weight: 700; }
    .form-textarea {
      border-radius: 0 0 10px 10px !important;
      padding: 14px !important;
      line-height: 1.6 !important;
      min-height: 220px;
      resize: vertical;
    }
    .emoji-picker {
      display: none;
      position: absolute;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 100;
      max-width: 320px;
      flex-wrap: wrap;
      gap: 2px;
    }
    .emoji-picker.show { display: flex; }
    .emoji-item {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 6px;
    }
    .emoji-item:hover, .emoji-item:focus-visible { background: rgba(255, 107, 157, .1); outline: none; transform: translateY(-1px); }
    .editor-wrapper { position: relative; }

    /* ===== 移动端适配：底部 tab bar 高度 =====
       移动端底部 tab bar 是 60px 高的 fixed 元素，
       必须给主内容预留空间，否则最下面的按钮会被遮挡无法点击 */
    @media (max-width: 768px) {
      .main-container, .page-container, .post-form-card {
        padding-bottom: 100px !important;
      }
      .editor-toolbar-hint { flex: 1 1 100%; order: 3; }
    }

    /* ===== 顶部 navbar 高度适配 =====
       顶部 navbar 是 fixed，主内容需预留空间避免被遮 */
    .main-container { padding-top: 76px; }

    /* ===== 表单卡片整体美化 ===== */
    .post-form-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(118, 75, 162, 0.08), 0 1px 3px rgba(0,0,0,0.04);
      border: 1px solid rgba(118, 75, 162, 0.1);
    }
    .form-group { margin-bottom: 22px; }
    .form-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      color: #4a3b5c;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .form-group label .optional {
      font-weight: 400;
      color: #a89eb5;
      font-size: 0.85rem;
      margin-left: 4px;
    }
    .form-input, .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e6dfee;
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fafbff;
      transition: all 0.2s;
      font-family: inherit;
      box-sizing: border-box;
    }
    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: #a78bfa;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
    }
    .form-input::placeholder, .form-textarea::placeholder { color: #b5adbf; }

    /* ===== 上传区美化 ===== */
    .image-upload-area {
      border: 2px dashed #d4c4e8;
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
      background: linear-gradient(180deg, #fdfaff, #f7f3fc);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .image-upload-area:hover {
      border-color: #a78bfa;
      background: linear-gradient(180deg, #f7f0ff, #f0e8fa);
    }
    .image-upload-area .upload-icon { font-size: 32px; }
    .image-upload-area .upload-placeholder span:last-child {
      color: #6b5a7e;
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* ===== 匿名开关美化 ===== */
    .toggle-label {
      display: flex !important;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      padding: 14px 18px;
      background: linear-gradient(180deg, #fafbff, #f4f0fa);
      border-radius: 12px;
      border: 1px solid #ebe5f3;
      margin: 0;
    }
    .toggle-label > span:first-child {
      font-weight: 600;
      color: #4a3b5c;
      font-size: 0.95rem;
    }
    .toggle-switch { margin-left: auto; }

    /* ===== 提交按钮美化 ===== */
    .btn-block {
      width: 100%;
      padding: 14px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(118, 75, 162, 0.3);
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .btn-block:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
    }
    .btn-block:active { transform: translateY(0); }
    .btn-block:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== 页面标题美化 ===== */
    .page-header {
      text-align: center;
      margin-bottom: 28px;
      padding: 24px 16px;
      background: linear-gradient(135deg, rgba(255, 107, 157, 0.08), rgba(118, 75, 162, 0.08));
      border-radius: 18px;
      border: 1px solid rgba(255, 107, 157, 0.1);
    }
    .page-title {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FF6B9D, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      letter-spacing: 1px;
    }
    .page-subtitle {
      color: #8b7a9c;
      font-size: 0.9rem;
      margin-top: 6px;
    }
  </style>

  <div class="main-container">
    <div class="page-container">
      <div class="page-header">
        <h1 class="page-title">编辑帖子</h1>
        <p class="page-subtitle">修改你的帖子内容</p>
      </div>

      <!-- 编辑表单 -->
      <div class="post-form-card">
        <form id="editPostForm">
          <!-- 分类选择 -->
          <div class="form-group">
            <label for="postCategory">分类</label>
            <select id="postCategory" class="form-input" required>
              <option value="">选择分类</option>
              <option value="日常">日常</option>
              <option value="表白">表白</option>
              <option value="吐槽">吐槽</option>
              <option value="求助">求助</option>
              <option value="交友">交友</option>
              <option value="二手">二手</option>
              <option value="寻物">寻物</option>
              <option value="投票">投票</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <!-- 标题 -->
          <div class="form-group">
            <label for="postTitle">标题 <span class="required-tag">必填</span></label>
            <input type="text" id="postTitle" class="form-input" placeholder="给帖子起个标题吧~" maxlength="100" required>
          </div>

          <!-- 内容 -->
          <div class="form-group">
            <label for="postContent">内容 <span class="optional">(选填)</span></label>
            <div class="editor-wrapper">
              <div class="editor-toolbar" role="toolbar" aria-label="内容编辑工具">
                <button type="button" class="editor-btn editor-btn-format" title="给选中文字加粗" aria-label="加粗" onclick="insertFormat('bold')"><b class="editor-btn-mark">B</b><span class="editor-btn-label">粗体</span></button>
                <button type="button" class="editor-btn editor-btn-format" title="给选中文字加斜体" aria-label="斜体" onclick="insertFormat('italic')"><i class="editor-btn-mark">I</i><span class="editor-btn-label">斜体</span></button>
                <button type="button" class="editor-btn editor-btn-emoji" id="editEmojiTrigger" data-emoji-trigger title="打开表情面板" aria-label="表情" aria-controls="emojiPicker" aria-expanded="false" onclick="showEmojiPicker()"><span aria-hidden="true">😊</span><span class="editor-btn-label">表情</span></button>
                <span class="editor-toolbar-hint">选中文字后可应用格式</span>
                <div class="word-counter"><span id="charCount">0</span> / 2000</div>
              </div>
              <textarea id="postContent" class="form-textarea" tabindex="-1" aria-hidden="true" hidden></textarea>
              <div id="postContentEditor" class="form-textarea editor-surface" contenteditable="true" role="textbox" aria-multiline="true" aria-label="帖子内容" data-placeholder="分享你的想法..."></div>
              <div class="emoji-picker" id="emojiPicker"></div>
            </div>
          </div>

          <!-- 投票选项（编辑用） -->
          <div class="form-group" id="pollGroup" style="display:none;">
            <label>投票选项 <span class="optional">(至少2项)</span></label>
            <div id="pollOptionsContainer"></div>
            <button type="button" class="btn-add-option" onclick="addEditPollOption()" style="margin-top:8px;">+ 添加选项</button>
            <label class="poll-multiple-label" style="margin-top:10px;display:inline-flex;"><input type="checkbox" id="pollMultiple"> 允许多选</label>
            <div class="form-hint" style="font-size:0.75rem;color:#94a3b8;margin-top:6px;">⚠️ 修改选项会清空已有投票数</div>
          </div>

          <!-- 图片上传 -->
          <div class="form-group">
            <label>图片 <span class="optional">(选填，最多9张)</span></label>
            <div class="image-upload-area" id="imageUploadArea">
              <div class="upload-placeholder">
                <span class="upload-icon">📷</span>
                <span>点击上传图片</span>
              </div>
              <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
            </div>
            <div class="image-preview-list" id="imagePreviewList"></div>
          </div>

          <!-- 匿名发布 -->
          <div class="form-group">
            <label class="toggle-label">
              <span>匿名发布</span>
              <div class="toggle-switch">
                <input type="checkbox" id="anonymousToggle">
                <span class="toggle-slider"></span>
              </div>
            </label>
          </div>

          <!-- 提交按钮 -->
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            保存修改
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var defaultSiteName = '示例校园墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      var siteInfoRequest = window.CampusWallSiteInfoPromise;
      if (!siteInfoRequest) {
        siteInfoRequest = fetch('/api/site-info', { credentials: 'same-origin', cache: 'no-store' })
          .then(function(res) { return res.ok ? res.json() : null; })
          .catch(function() { return null; });
        window.CampusWallSiteInfoPromise = siteInfoRequest;
      }
      siteInfoRequest
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 编辑帖子';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
      }
    })();
  </script>
