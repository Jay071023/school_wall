<head>
  <style id="app-boot-style">
    html.app-booting { background: #f7f1e6; }
    html.app-booting body { visibility: hidden; }
  </style>
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("app-booting");
      var released = false;
      var themeReady = false;
      var hardTimeoutId = window.setTimeout(function () { release(true); }, 7000);
      function release(force) {
        if (released || (!themeReady && !force)) return;
        released = true;
        window.clearTimeout(hardTimeoutId);
        root.classList.remove("app-booting");
      }
      window.addEventListener("festival-theme-ready", function () {
        themeReady = true;
        release(false);
      }, { once: true });
    })();
  </script>

            </div>

            </div>

        </div>

            </optgroup>

            <optgroup label="哨兵 (Sentinels)">

  <script src="/js/app.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    // 检查登录状态
    if (!isLoggedIn()) {
      window.location.href = '/login';
      return;
    }

    var user = getCurrentUser();
    if (!user) return;

    // 填充已有数据
    var nicknameInput = document.getElementById('editNickname');
    var emailInput = document.getElementById('editEmail');
    var birthdayInput = document.getElementById('editBirthday');
    var mbtiSelect = document.getElementById('editMbti');
    var hobbiesInput = document.getElementById('editHobbies');
    var avatarPreview = document.getElementById('editAvatarPreview');
    var avatarInput = document.getElementById('editAvatarInput');
    var avatarUploadArea = document.getElementById('avatarUploadArea');
    var saveBtn = document.getElementById('saveProfileBtn');

    if (nicknameInput) nicknameInput.value = user.nickname || '';
    if (emailInput) emailInput.value = user.email || '';
    if (birthdayInput) {
      var birthday = user.birthday || '';
      if (birthday && typeof birthday === 'string' && birthday.includes('T')) {
        birthday = birthday.split('T')[0];
      }
      birthdayInput.value = birthday;
    }
    if (mbtiSelect && user.mbti) mbtiSelect.value = user.mbti;
    if (hobbiesInput) hobbiesInput.value = user.hobbies || '';
    if (avatarPreview) avatarPreview.src = user.avatar || '/uploads/avatars/default.png';

    // 性别选项卡
    var selectedGender = user.gender || '';
    var genderTabs = document.querySelectorAll('.edit-gender-tab');
    genderTabs.forEach(function(tab) {
      if (tab.getAttribute('data-value') === selectedGender) {
        tab.classList.add('active');
      }
      tab.addEventListener('click', function() {
        genderTabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        selectedGender = tab.getAttribute('data-value');
      });
    });

    // 头像上传
    if (avatarUploadArea && avatarInput) {
      avatarUploadArea.addEventListener('click', function() {
        avatarInput.click();
      });
      avatarInput.addEventListener('change', function() {
        var file = this.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          showToast('头像图片不能超过2MB', 'error');
          return;
        }
        var reader = new FileReader();
        reader.onload = function(e) {
          avatarPreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
        // 上传头像
        var formData = new FormData();
        formData.append('avatar', file);
        fetch('/api/upload/avatar', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getToken() },
          body: formData
        }).then(function(res) { return res.json(); }).then(function(data) {
          if (data.code === 200) {
            var currentUser = getCurrentUser();
            currentUser.avatar = data.data.avatar;
            var remembered = !!localStorage.getItem('token');
            saveAuth(getToken(), currentUser, remembered);
            showToast('头像更新成功');
          } else {
            showToast(data.message || '头像上传失败', 'error');
            // 恢复原头像
            avatarPreview.src = getCurrentUser().avatar || '/uploads/avatars/default.png';
          }
        }).catch(function() {
          showToast('头像上传失败', 'error');
          avatarPreview.src = getCurrentUser().avatar || '/uploads/avatars/default.png';
        });
      });
    }

    // 保存资料
    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        var nickname = nicknameInput ? nicknameInput.value.trim() : '';
        var email = emailInput ? emailInput.value.trim() : '';
        var birthday = birthdayInput ? birthdayInput.value : '';
        var mbti = mbtiSelect ? mbtiSelect.value : '';
        var hobbies = hobbiesInput ? hobbiesInput.value.trim() : '';

        if (!nickname) {
          showToast('昵称不能为空', 'error');
          return;
        }
        if (nickname.length > 20) {
          showToast('昵称不能超过20个字符', 'error');
          return;
        }
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showToast('邮箱格式不正确', 'error');
          return;
        }

        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span>⏳</span> 保存中...';

        var profileData = {
          nickname: nickname,
          email: email || null,
          birthday: birthday || null,
          mbti: mbti || null,
          gender: selectedGender || null,
          hobbies: hobbies || null
        };

        authFetch('/api/auth/profile', {
          method: 'PUT',
          body: JSON.stringify(profileData)
        }).then(function(data) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<span>💾</span> 保存修改';
          if (data.code === 200) {
            // 更新本地用户信息
            var currentUser = getCurrentUser();
            if (data.data) {
              currentUser.nickname = data.data.nickname;
              currentUser.email = data.data.email;
              currentUser.birthday = data.data.birthday;
              currentUser.mbti = data.data.mbti;
              currentUser.gender = data.data.gender;
              currentUser.hobbies = data.data.hobbies;
            }
            var remembered = !!localStorage.getItem('token');
            saveAuth(getToken(), currentUser, remembered);
            showToast('资料更新成功');
            setTimeout(function() {
              window.location.href = '/profile';
            }, 1000);
          } else {
            showToast(data.message || '更新失败', 'error');
          }
        }).catch(function() {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<span>💾</span> 保存修改';
          showToast('网络错误', 'error');
        });
      });
    }
  });
  </script>
  <script>var currentUser = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || 'null');</script>
  <script>
    (function() {
      var defaultSiteName = '校园墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      var siteInfoRequest = window.CampusWallSiteInfoPromise;
      if (!siteInfoRequest) {
        siteInfoRequest = fetch('/api/site-info', { credentials: 'same-origin', cache: 'no-store' })
          .then(function(res) { return res.ok ? res.json() : null; })
          .catch(function() { return null; });
        window.CampusWallSiteInfoPromise = siteInfoRequest;
      }
      siteInfoRequest
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 编辑资料';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
      }
    })();
  </script>

  <style id="edit-profile-page-responsive-polish">

      overflow-wrap: anywhere; word-break: break-word;
    }
    body.edit-profile-page .edit-profile-input,
    body.edit-profile-page .edit-profile-select,
    body.edit-profile-page .edit-profile-textarea {
      display: block; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box;

    @media (prefers-reduced-motion: reduce) {
      body.edit-profile-page *, body.edit-profile-page *::before, body.edit-profile-page *::after {

    }
