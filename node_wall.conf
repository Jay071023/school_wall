server
{
listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
   server_name campus.jay23.cn wall.jay23.cn;
    index index.html index.htm default.htm default.html;

    # SSL
    include /www/server/panel/vhost/nginx/well-known/wall.conf;
    ssl_certificate    /www/server/panel/vhost/cert/wall/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/wall/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    # 前端静态文件
    root /www/wwwroot/wall.jay23.cn/frontend;

    # 安全文件/目录屏蔽
    location ~* (\.user\.ini|\.htaccess|\.env|\.git|\.svn|node_modules|runtime|\.claude) {
        return 404;
    }

    # 动态路由 → 对应HTML页面
    location ~ ^/post/\d+$          { rewrite ^ /post-detail.html last; }
    location ~ ^/edit-post/\d+$     { rewrite ^ /edit-post.html last; }
    location = /admin               { rewrite ^ /admin/ last; }

    # API → Node 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 上传文件 → 从后端目录读取
    location /uploads/ {
        alias /www/wwwroot/wall.jay23.cn/campus-wall/public/uploads/;
    }

    # 其他 → 静态文件
    location / {
        try_files $uri $uri/ $uri.html =404;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    access_log  /www/wwwlogs/wall.log;
    error_log  /www/wwwlogs/wall.error.log;
}
