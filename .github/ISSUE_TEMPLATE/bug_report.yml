name: Bug report
description: Report a reproducible problem in the public mirror.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real user content, credentials, private addresses or security exploit details.
  - type: textarea
    id: trigger
    attributes:
      label: What happened?
      description: Include the smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, Node.js version, viewport, or route
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Redact screenshots and logs before attaching them.
