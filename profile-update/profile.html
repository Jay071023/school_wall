<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘉二の墙墙 - 个人主页</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 背景装饰元素（大屏幕显示） -->
  <div class="bg-decorations" id="bgDecorations">
    <div class="bg-gradient bg-gradient-1"></div>
    <div class="bg-gradient bg-gradient-2"></div>
    <div class="bg-gradient bg-gradient-3"></div>
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
    <div class="bg-circle bg-circle-4"></div>
    <div class="bg-line bg-line-1"></div>
    <div class="bg-line bg-line-2"></div>
    <div class="bg-dot bg-dot-1"></div>
    <div class="bg-dot bg-dot-2"></div>
    <div class="bg-dot bg-dot-3"></div>
    <div class="bg-dot bg-dot-4"></div>
    <div class="bg-dot bg-dot-5"></div>
  </div>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">🏠 嘉二の墙墙</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link" data-page="home"><span>🏠</span> 首页</a>
        <a href="/radio" class="nav-link" data-page="radio"><span>🎵</span> 点歌</a>
        <a href="/profile" class="nav-link" data-page="profile"><span>👤</span> 我的</a>
      </div>
      <div class="nav-auth" id="navAuth">
        <a href="/login" class="btn-login">登录</a>
        <a href="/register" class="btn-register">注册</a>
      </div>
      <div class="nav-user" id="navUser" style="display:none">
        <a href="/profile" class="nav-avatar" id="navAvatar"><img src="" alt=""></a>
        <span class="nav-nickname" id="navNickname"></span>
      </div>
      <button class="theme-switch" id="themeSwitch" title="切换主题" onclick="(function(){var t=document.documentElement.getAttribute('data-theme')==='dark';if(t){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light');this.textContent='🌙'}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');this.textContent='☀️'}})()">🌙</button>
      <button class="nav-mobile-toggle" id="navToggle">☰</button>
    </div>
  </nav>

  <!-- 主内容区 -->
  <div class="main-content">
    <!-- 个人资料卡片 -->
    <div class="profile-card" id="profileCard">
      <div class="profile-avatar-wrapper">
        <img class="profile-avatar" id="profileAvatar" src="/images/default-avatar.png" alt="头像">
      </div>
      <div class="profile-nickname" id="profileNickname"></div>
      <div class="profile-join-time" id="profileJoinTime"></div>
      <div class="profile-info-tags" id="profileInfoTags" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;"></div>
      <a href="/edit-profile" class="btn-edit-profile" id="editProfileBtn" style="text-decoration:none;display:block;">✏️ 编辑资料</a>
      <button class="btn-edit-profile" id="changePasswordBtn" style="margin-top:8px;background:var(--bg-secondary);color:var(--text-secondary);">🔒 修改密码</button>
    </div>

    <!-- 标签页 -->
    <div class="profile-tabs-section">
      <div class="profile-tabs">
        <div class="profile-tab active" data-tab="posts">我的帖子</div>
        <div class="profile-tab" data-tab="favorites">我的收藏</div>
        <div class="profile-tab" data-tab="songs">我的点歌</div>
      </div>
      <div class="profile-tab-content" id="tabContent"></div>
      <button class="btn-profile-load-more" id="loadMoreBtn" style="display:none">加载更多</button>
    </div>
  </div>

  <!-- 修改密码面板 -->
  <div class="password-panel" id="passwordPanel" style="display:none">
    <div class="password-panel-inner">
      <div class="password-panel-header">
        <h3>
          <span class="header-icon">🔐</span>
          <span>修改密码</span>
        </h3>
        <button class="password-panel-close" id="passwordPanelClose">✕</button>
      </div>
      <form id="passwordForm" class="password-panel-body" onsubmit="return false;">
        <div class="password-field">
          <label class="password-field-label">
            <span class="field-icon">🔒</span>
            <span>当前密码</span>
          </label>
          <div class="password-field-input-wrap">
            <input type="password" class="password-field-input" id="oldPassword" placeholder="请输入当前密码" autocomplete="current-password">
            <button type="button" class="password-visibility-btn" data-target="oldPassword">
              <span class="visibility-icon">👁️</span>
            </button>
          </div>
        </div>
        <div class="password-field">
          <label class="password-field-label">
            <span class="field-icon">✨</span>
            <span>新密码</span>
          </label>
          <div class="password-field-input-wrap">
            <input type="password" class="password-field-input" id="newPassword" placeholder="请输入新密码（至少6位）" autocomplete="new-password" oninput="updatePasswordStrength(this.value)">
            <button type="button" class="password-visibility-btn" data-target="newPassword">
              <span class="visibility-icon">👁️</span>
            </button>
          </div>
          <div class="password-strength-meter" id="passwordStrengthMeter">
            <div class="strength-meter-bar">
              <div class="strength-meter-fill" id="strengthFill"></div>
            </div>
            <span class="strength-meter-text" id="strengthText">请输入新密码</span>
          </div>
        </div>
        <div class="password-field">
          <label class="password-field-label">
            <span class="field-icon">✅</span>
            <span>确认新密码</span>
          </label>
          <div class="password-field-input-wrap">
            <input type="password" class="password-field-input" id="confirmNewPassword" placeholder="请再次输入新密码" autocomplete="new-password">
            <button type="button" class="password-visibility-btn" data-target="confirmNewPassword">
              <span class="visibility-icon">👁️</span>
            </button>
          </div>
        </div>
        <div class="password-panel-footer">
          <button type="button" class="btn-cancel" id="passwordPanelCancel">取消</button>
          <button type="button" class="btn-confirm" id="passwordSaveBtn">
            <span class="btn-icon">💾</span>
            <span>确认修改</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/profile.js"></script>
  <script>var currentUser = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || 'null');</script>
  <script>
    (function() {
      var defaultSiteName = '嘉二の墙墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      fetch('/api/site-info')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 个人主页';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
      }
    })();
  </script>
</body>
</html>
