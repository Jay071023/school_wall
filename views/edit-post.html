<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘉二の墙墙 - 编辑帖子</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <!-- 光晕效果背景 -->
  <div class="page-glow">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
  </div>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">🏠 嘉二の墙墙</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link" data-page="home"><span>🏠</span> 首页</a>
        <a href="/radio" class="nav-link" data-page="radio"><span>🎵</span> 点歌</a>
        <a href="/profile" class="nav-link" data-page="profile"><span>👤</span> 我的</a>
        <a href="/messages.html" class="nav-link" data-page="messages"><span>💌</span> 私信</a>
      </div>
      <div class="nav-auth" id="navAuth">
        <a href="/login" class="btn-login">登录</a>
        <a href="/register" class="btn-register">注册</a>
      </div>
      <div class="nav-user" id="navUser" style="display:none">
        <a href="/profile" class="nav-avatar" id="navAvatar"><img src="" alt=""></a>
        <span class="nav-nickname" id="navNickname"></span>
      </div>
      <button class="theme-switch" id="themeSwitch" title="切换主题">🌙</button>
      <button class="nav-mobile-toggle" id="navToggle">☰</button>
    </div>
  </nav>

  <!-- 主内容 -->
  <div class="main-container">
    <div class="page-container">
      <div class="page-header">
        <h1 class="page-title">编辑帖子</h1>
        <p class="page-subtitle">修改你的帖子内容</p>
      </div>

      <!-- 编辑表单 -->
      <div class="post-form-card">
        <form id="editPostForm">
          <!-- 分类选择 -->
          <div class="form-group">
            <label for="postCategory">分类</label>
            <select id="postCategory" class="form-input" required>
              <option value="">选择分类</option>
              <option value="日常">日常</option>
              <option value="表白">表白</option>
              <option value="吐槽">吐槽</option>
              <option value="求助">求助</option>
              <option value="交友">交友</option>
              <option value="二手">二手</option>
              <option value="寻物">寻物</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <!-- 标题 -->
          <div class="form-group">
            <label for="postTitle">标题 <span class="optional">(选填)</span></label>
            <input type="text" id="postTitle" class="form-input" placeholder="给帖子起个标题吧~" maxlength="50">
          </div>

          <!-- 内容 -->
          <div class="form-group">
            <label for="postContent">内容</label>
            <textarea id="postContent" class="form-textarea" placeholder="分享你的想法..." rows="6" required></textarea>
            <div class="char-count"><span id="charCount">0</span> / 2000</div>
          </div>

          <!-- 图片上传 -->
          <div class="form-group">
            <label>图片 <span class="optional">(选填，最多9张)</span></label>
            <div class="image-upload-area" id="imageUploadArea">
              <div class="upload-placeholder">
                <span class="upload-icon">📷</span>
                <span>点击上传图片</span>
              </div>
              <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
            </div>
            <div class="image-preview-list" id="imagePreviewList"></div>
          </div>

          <!-- 匿名发布 -->
          <div class="form-group">
            <label class="toggle-label">
              <span>匿名发布</span>
              <div class="toggle-switch">
                <input type="checkbox" id="anonymousToggle">
                <span class="toggle-slider"></span>
              </div>
            </label>
          </div>

          <!-- 提交按钮 -->
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            保存修改
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/edit-post.js"></script>
  <script>var currentUser = JSON.parse(localStorage.getItem('user') || 'null');</script>
  <script>
    (function() {
      var defaultSiteName = '嘉二の墙墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      fetch('/api/site-info')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 编辑帖子';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
      }
    })();
  </script>
  
  <!-- 移动端底部导航 -->
  <nav class="bottom-tab-bar" id="bottomTabBar">
    <a href="/" class="tab-item" data-tab="home">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">首页</span>
    </a>
    <a href="/radio" class="tab-item" data-tab="radio">
      <span class="tab-icon">🎵</span>
      <span class="tab-label">点歌</span>
    </a>
    <a href="/new-post" class="tab-item tab-item-center" data-tab="post">
      <span class="tab-icon">✏️</span>
    </a>
    <a href="/feedback" class="tab-item" data-tab="feedback">
      <span class="tab-icon">💬</span>
      <span class="tab-label">反馈</span>
    </a>
    <a href="/profile" class="tab-item" data-tab="profile" id="tabProfile">
      <span class="tab-icon">👤</span>
      <span class="tab-label">我的</span>
    </a>
  </nav>
  
  <footer class="footer">
    <p>&copy; 2026 嘉二人の墙墙 All Rights Reserved</p>
    <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="nofollow">粤ICP备2025514735号-3</a></p>
  </footer>
</body>
</html>
