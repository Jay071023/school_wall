<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘉二の墙墙 - 发布动态</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="在嘉二の墙墙发布你的校园动态，分享生活、求助、表白、二手交易等。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://wall.jay23.cn/new-post">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <!-- 光晕效果背景 -->
  <div class="page-glow">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
  </div>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">🏠 嘉二の墙墙</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link" data-page="home"><span>🏠</span> 首页</a>
        <a href="/radio" class="nav-link" data-page="radio"><span>🎵</span> 点歌</a>
        <a href="/feedback" class="nav-link" data-page="feedback"><span>💬</span> 反馈</a>
        <a href="/profile" class="nav-link" data-page="profile"><span>👤</span> 我的</a>
        <a href="/messages.html" class="nav-link" data-page="messages"><span>💌</span> 私信</a>
      </div>
      <div class="nav-auth" id="navAuth">
        <a href="/login" class="btn-login">登录</a>
        <a href="/register" class="btn-register">注册</a>
      </div>
      <div class="nav-user" id="navUser" style="display:none">
        <a href="/profile" class="nav-avatar" id="navAvatar"><img src="" alt=""></a>
        <span class="nav-nickname" id="navNickname"></span>
      </div>
      <button class="theme-switch" id="themeSwitch" title="切换主题" onclick="(function(){var t=document.documentElement.getAttribute('data-theme')==='dark';if(t){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light');this.textContent='🌙'}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');this.textContent='☀️'}})()">🌙</button>
      <button class="nav-mobile-toggle" id="navToggle">☰</button>
    </div>
  </nav>

  <!-- 主内容区 -->
  <div class="main-content">
    <div class="post-form-card">
      <div class="post-form-header">
        <h2 class="post-form-title">发布新动态</h2>
        <p class="post-form-subtitle">分享你的想法...</p>
      </div>
      <form class="post-form" id="postForm">
        <!-- 标题 -->
        <div class="form-group">
          <label class="form-label">标题 <span class="optional-tag">选填</span></label>
          <input type="text" id="postTitle" class="form-input" placeholder="标题（可选）">
        </div>
        <!-- 内容 -->
        <div class="form-group">
          <label class="form-label">内容 <span class="required-tag">必填</span></label>
          <textarea id="postContent" class="form-textarea" placeholder="说点什么..." rows="4"></textarea>
        </div>
        <!-- 图片上传 -->
        <div class="form-group">
          <label class="form-label">图片</label>
          <div class="image-upload-area" id="uploadArea">
            <div class="upload-placeholder" id="uploadPlaceholder">
              <div class="upload-icon">📷</div>
              <div class="upload-text">点击或拖拽上传图片</div>
              <div class="upload-hint">最多9张，支持JPG/PNG/GIF</div>
            </div>
            <input type="file" class="upload-input" id="fileInput" multiple accept="image/*">
          </div>
          <div class="image-preview-list" id="imagePreviewList"></div>
        </div>
        <!-- 分类选择 -->
        <div class="form-group">
          <label class="form-label">分类 <span class="required-tag">必填</span></label>
          <div class="category-tags" id="categoryTags">
            <span class="category-tag selected" data-value="daily">日常</span>
            <span class="category-tag" data-value="confession">表白</span>
            <span class="category-tag" data-value="help">求助</span>
            <span class="category-tag" data-value="secondhand">二手</span>
            <span class="category-tag" data-value="club">社团</span>
            <span class="category-tag" data-value="other">其他</span>
          </div>
        </div>
        <!-- 匿名开关 -->
        <div class="toggle-switch-wrapper" id="anonymousOption" style="display: none;">
          <span>匿名发布</span>
          <label class="toggle-switch">
            <input type="checkbox" id="anonymousToggle">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-hint">开启后将以匿名身份发布</span>
        </div>
        <!-- 提交按钮 -->
        <div class="form-actions">
          <button type="submit" class="btn-publish" id="publishBtn">发布动态</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/post.js"></script>
  <script>var currentUser = JSON.parse(localStorage.getItem('user') || 'null');</script>
  <script>
    (function() {
      var defaultSiteName = '嘉二の墙墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      fetch('/api/site-info')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 发布动态';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
      }
    })();
  </script>
  
  <!-- 移动端底部导航 -->
  <nav class="bottom-tab-bar" id="bottomTabBar">
    <a href="/" class="tab-item" data-tab="home">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">首页</span>
    </a>
    <a href="/radio" class="tab-item" data-tab="radio">
      <span class="tab-icon">🎵</span>
      <span class="tab-label">点歌</span>
    </a>
    <a href="/new-post" class="tab-item active tab-item-center" data-tab="post">
      <span class="tab-icon">✏️</span>
    </a>
    <a href="/feedback" class="tab-item" data-tab="feedback">
      <span class="tab-icon">💬</span>
      <span class="tab-label">反馈</span>
    </a>
    <a href="/profile" class="tab-item" data-tab="profile" id="tabProfile">
      <span class="tab-icon">👤</span>
      <span class="tab-label">我的</span>
    </a>
  </nav>
  
  <footer class="footer">
    <p>&copy; 2026 嘉二人の墙墙 All Rights Reserved</p>
    <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="nofollow">粤ICP备2025514735号-3</a></p>
  </footer>
</body>
</html>
