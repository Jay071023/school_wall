<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>重置密码 - 嘉二の墙墙</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #FFF5F8, #F8F0FF, #F0F5FF); padding: 20px; }
        .reset-card { background: #fff; border-radius: 20px; padding: 36px 28px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .reset-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .reset-desc { font-size: 13px; color: #999; text-align: center; margin-bottom: 28px; line-height: 1.6; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 15px; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
        .form-group input:focus { border-color: #FF6B9D; }
        .btn-reset { width: 100%; padding: 14px; background: linear-gradient(135deg, #FF6B9D, #FF8FB1); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .btn-reset:active { opacity: 0.85; }
        .btn-reset:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 13px; text-align: center; display: none; }
        .msg.success { display: block; background: #d1fae5; color: #059669; }
        .msg.error { display: block; background: #fee2e2; color: #dc2626; }
        .login-link { text-align: center; margin-top: 18px; }
        .login-link a { font-size: 13px; color: #FF6B9D; text-decoration: none; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="reset-title">🔑 重置密码</div>
        <div class="reset-desc">输入微信收到的6位验证码，设置新密码</div>

        <div class="form-group">
            <label>验证码</label>
            <input type="text" id="resetCode" placeholder="输入6位验证码" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:18px;font-weight:600;">
        </div>
        <div class="form-group">
            <label>新密码</label>
            <input type="password" id="newPassword" placeholder="至少6个字符" minlength="6">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="confirmPassword" placeholder="再次输入新密码">
        </div>

        <button class="btn-reset" id="btnReset" onclick="doReset()">确认重置</button>
        <div class="msg" id="msg"></div>
        <div class="login-link"><a href="/login">← 返回登录</a></div>
    </div>

    <script>
        // 自动填充URL中的验证码
        (function() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            if (code) {
                document.getElementById('resetCode').value = code.toUpperCase();
            }
        })();

        function showMsg(text, type) {
            var el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg ' + type;
        }

        async function doReset() {
            var code = document.getElementById('resetCode').value.trim().toUpperCase();
            var pwd = document.getElementById('newPassword').value;
            var pwd2 = document.getElementById('confirmPassword').value;

            if (!code || code.length !== 6) { showMsg('请输入6位验证码', 'error'); return; }
            if (!pwd || pwd.length < 6) { showMsg('新密码至少6个字符', 'error'); return; }
            if (pwd !== pwd2) { showMsg('两次密码不一致', 'error'); return; }

            var btn = document.getElementById('btnReset');
            btn.disabled = true;
            btn.textContent = '重置中...';

            try {
                var res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, newPassword: pwd })
                });
                var data = await res.json();
                if (data.code === 200) {
                    showMsg('✅ 密码重置成功！3秒后跳转登录...', 'success');
                    setTimeout(function() { window.location.href = '/login'; }, 3000);
                } else {
                    showMsg(data.message || '重置失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '确认重置';
                }
            } catch (e) {
                showMsg('网络错误', 'error');
                btn.disabled = false;
                btn.textContent = '确认重置';
            }
        }
    </script>
</body>
</html>
