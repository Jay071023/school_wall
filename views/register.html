<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘉二の墙墙 - 注册</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="注册嘉二の墙墙账号，加入校园信息交流平台，与同学们一起畅所欲言。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://wall.jay23.cn/register">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/mobile-fix.css">
  <style>
    /* 用户协议区域 */
    .agreement-section {
      background: rgba(255, 107, 157, 0.05);
      border: 1px solid rgba(255, 107, 157, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    /* 美化复选框 */
    .agreement-checkbox {
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      color: #666;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .agreement-checkbox input[type="checkbox"] {
      display: none;
    }
    .agreement-checkbox .checkmark {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255, 107, 157, 0.3);
      border-radius: 6px;
      margin-right: 10px;
      position: relative;
      transition: all 0.3s ease;
      flex-shrink: 0;
      background: white;
    }
    .agreement-checkbox input[type="checkbox"]:checked + .checkmark {
      background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%);
      border-color: #FF6B9D;
    }
    .agreement-checkbox input[type="checkbox"]:checked + .checkmark::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 14px;
      font-weight: bold;
    }
    .agreement-checkbox:hover .checkmark {
      border-color: #FF6B9D;
    }
    .agreement-text {
      flex: 1;
    }
    .agreement-text a {
      color: #FF6B9D;
      text-decoration: none;
      font-weight: 500;
    }
    .agreement-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- 光晕效果背景 -->
  <div class="page-glow">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
  </div>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">🏠 嘉二の墙墙</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link" data-page="home"><span>🏠</span> 首页</a>
        <a href="/radio" class="nav-link" data-page="radio"><span>🎵</span> 点歌</a>
        <a href="/feedback" class="nav-link" data-page="feedback"><span>💬</span> 反馈</a>
        <a href="/profile" class="nav-link" data-page="profile"><span>👤</span> 我的</a>
        <a href="/messages.html" class="nav-link" data-page="messages"><span>💌</span> 私信</a>
      </div>
      <div class="nav-auth" id="navAuth">
        <a href="/login" class="btn-login">登录</a>
        <a href="/register" class="btn-register">注册</a>
      </div>
      <div class="nav-user" id="navUser" style="display:none">
        <a href="/profile" class="nav-avatar" id="navAvatar"><img src="" alt=""></a>
        <span class="nav-nickname" id="navNickname"></span>
      </div>
      <button class="theme-switch" id="themeSwitch" title="切换主题" onclick="(function(){var t=document.documentElement.getAttribute('data-theme')==='dark';if(t){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light');this.textContent='🌙'}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');this.textContent='☀️'}})()">🌙</button>
      <button class="nav-mobile-toggle" id="navToggle">☰</button>
    </div>
  </nav>

  <!-- 移动端顶部快捷登录入口 -->
  <div class="mobile-auth-bar">
    <span>已有账号？</span>
    <a href="/login" class="mobile-quick-login">立即登录 →</a>
  </div>

  <!-- 注册页 -->
  <div class="auth-page">
    <div class="auth-decorations">
      <div class="decor-circle" style="width:300px;height:300px;background:rgba(78,205,196,0.15);top:-80px;left:-60px;"></div>
      <div class="decor-circle" style="width:200px;height:200px;background:rgba(255,107,107,0.15);bottom:-50px;right:-40px;"></div>
      <div class="decor-circle" style="width:150px;height:150px;background:rgba(255,217,61,0.15);top:30%;right:10%;"></div>
    </div>
    <div class="auth-card">
      <div class="auth-emoji">🎉</div>
      <h1 class="auth-title">加入嘉二の墙墙</h1>
      <p class="auth-subtitle">创建你的嘉二の墙墙账号</p>
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <input type="text" id="username" class="form-input" placeholder="请输入用户名（3-20个字符）" required minlength="3" maxlength="20">
        </div>
        <div class="form-group">
          <input type="text" id="nickname" class="form-input" placeholder="请输入昵称" required>
        </div>
        <div class="form-group">
          <input type="email" id="email" class="form-input" placeholder="请输入邮箱（用于接收通知、找回密码）" required>
          <div style="font-size:12px;color:#999;margin-top:4px;padding-left:4px;">📧 用于接收评论回复、点歌通知和找回密码</div>
        </div>
        <div class="form-group">
          <input type="password" id="password" class="form-input" placeholder="请输入密码（至少6个字符）" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <input type="password" id="confirmPassword" class="form-input" placeholder="请确认密码" required autocomplete="new-password">
        </div>
        
        <!-- 验证码 -->
        <div class="form-group captcha-group">
          <input type="text" id="captchaCode" class="form-input captcha-input" placeholder="请输入验证码" required>
          <img id="captchaImg" class="captcha-img" src="" alt="验证码" title="点击刷新验证码" onclick="loadCaptcha()">
        </div>
        
        <!-- 用户协议勾选 -->
        <div class="agreement-section">
          <label class="agreement-checkbox">
            <input type="checkbox" id="agreeTerms">
            <span class="checkmark"></span>
            <span class="agreement-text">
              我已阅读并同意 
              <a href="javascript:void(0);" onclick="showAgreement('user')">《用户协议》</a> 和 
              <a href="javascript:void(0);" onclick="showAgreement('privacy')">《隐私政策》</a>
            </span>
          </label>
        </div>
        
        <button type="submit" class="btn-register" id="registerBtn">注 册</button>
      </form>
      <div class="auth-link">
        已有账号？<a href="/login">去登录</a>
      </div>
      
      <!-- 备案号 -->
      <div class="beian-text">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="nofollow">粤ICP备2025514735号-3</a>
      </div>
    </div>
  </div>
  
  <!-- 用户协议弹窗 -->
  <div class="modal-overlay" id="agreementModal" style="display:none;">
    <div class="modal-content agreement-modal">
      <div class="modal-header">
        <h3 id="agreementTitle">协议</h3>
        <button class="modal-close" onclick="closeAgreement()">&times;</button>
      </div>
      <div class="modal-body" id="agreementBody">
        <!-- 协议内容将动态加载 -->
      </div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="closeAgreement()">我已阅读</button>
      </div>
    </div>
  </div>
  
  <style>
    /* 协议弹窗移动端优化 */
    @media (max-width: 768px) {
      .agreement-modal {
        max-height: 90vh !important;
        max-width: 95vw !important;
        border-radius: 20px 20px 0 0 !important;
        position: fixed !important;
        bottom: 0 !important;
        top: auto !important;
        left: 0 !important;
        right: 0 !important;
        margin: 0 !important;
        animation: slideUpModal 0.3s ease !important;
      }
      
      @keyframes slideUpModal {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      
      .agreement-modal .modal-header {
        padding: 16px 20px;
        border-radius: 20px 20px 0 0;
      }
      
      .agreement-modal .modal-header h3 {
        font-size: 1rem;
      }
      
      .agreement-modal .modal-close {
        width: 28px;
        height: 28px;
        font-size: 18px;
      }
      
      .agreement-modal .modal-body {
        padding: 20px;
        font-size: 0.85rem;
        line-height: 1.7;
      }
      
      .agreement-modal .modal-body h4 {
        font-size: 1.1rem;
        margin-bottom: 12px;
        padding-bottom: 10px;
      }
      
      .agreement-modal .modal-body h5 {
        font-size: 0.95rem;
        margin: 16px 0 8px 0;
      }
      
      .agreement-modal .modal-body p {
        margin: 8px 0;
        text-align: left;
      }
      
      .agreement-modal .modal-body ul {
        padding-left: 16px;
      }
      
      .agreement-modal .modal-body li {
        margin: 4px 0;
      }
      
      .agreement-modal .modal-footer {
        padding: 12px 20px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      }
      
      .agreement-modal .modal-footer .btn-primary {
        width: 100%;
        padding: 14px 24px;
        font-size: 1rem;
        border-radius: 25px;
      }
    }
    
    /* 关闭按钮位置微调 */
    .agreement-modal .modal-close {
      flex-shrink: 0;
    }
    
    /* 验证码样式 */
    .captcha-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .captcha-input {
      flex: 1;
    }
    
    .captcha-img {
      height: 44px;
      min-width: 100px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #ddd;
      transition: border-color 0.3s;
    }
    
    .captcha-img:hover {
      border-color: #FF6B9D;
    }
    
    @media (max-width: 480px) {
      .captcha-img {
        min-width: 80px;
        height: 40px;
      }
    }
  </style>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>var currentUser = JSON.parse(localStorage.getItem('user') || 'null');</script>
  <script>
  // 协议内容
  var agreements = {
    user: {
      title: '用户协议',
      content: '<h4>嘉二の墙墙 用户协议</h4>' +
        '<p>欢迎使用嘉二人の墙墙服务！在使用本服务之前，请仔细阅读本协议。</p>' +
        '<h5>一、服务说明</h5>' +
        '<p>1.1 嘉二人の墙墙是一个校园匿名社交平台，为用户提供发帖、评论、点歌等功能。</p>' +
        '<p>1.2 用户在使用本服务时，应遵守当地法律法规，不得发布违法违规内容。</p>' +
        '<h5>二、用户行为规范</h5>' +
        '<p>2.1 用户不得发布以下内容：</p>' +
        '<ul><li>违反法律法规的信息</li><li>侵犯他人隐私、名誉的内容</li><li>虚假信息、谣言</li><li>垃圾广告、商业推广</li><li>暴力、色情、血腥内容</li><li>其他不当内容</li></ul>' +
        '<p>2.2 用户应尊重其他用户，不得骚扰、辱骂、威胁他人。</p>' +
        '<h5>三、账号管理</h5>' +
        '<p>3.1 用户应妥善保管自己的账号和密码，因个人保管不善造成的损失由用户自行承担。</p>' +
        '<p>3.2 管理员有权对违规用户进行警告、禁言、封禁等处理。</p>' +
        '<h5>四、免责声明</h5>' +
        '<p>4.1 用户在本平台发表的内容仅代表个人观点，与平台立场无关。</p>' +
        '<p>4.2 因网络特性，本平台无法完全监控用户发布的内容，如有侵权请及时联系删除。</p>' +
        '<h5>五、协议修改</h5>' +
        '<p>5.1 本平台有权随时修改本协议，修改后的协议一经公布即生效。</p>' +
        '<p>5.2 用户继续使用本服务，视为接受修改后的协议。</p>'
    },
    privacy: {
      title: '隐私政策',
      content: '<h4>嘉二人の墙墙 隐私政策</h4>' +
        '<p>嘉二人の墙墙非常重视用户的隐私保护，本政策说明了我们如何收集、使用和保护您的个人信息。</p>' +
        '<h5>一、信息收集</h5>' +
        '<p>1.1 我们收集的信息包括：</p>' +
        '<ul><li>注册信息：用户名、昵称、密码（加密存储）</li><li>使用信息：发帖、评论、点歌记录</li><li>设备信息：IP地址、设备类型</li><li>其他您主动提供的信息</li></ul>' +
        '<h5>二、信息使用</h5>' +
        '<p>2.1 我们使用收集的信息用于：</p>' +
        '<ul><li>提供和改进服务</li><li>处理用户反馈</li><li>安全监控和违规处理</li><li>法律法规要求的情况</li></ul>' +
        '<h5>三、信息保护</h5>' +
        '<p>3.1 我们采取多种安全措施保护您的信息，包括数据加密、访问控制等。</p>' +
        '<p>3.2 除法律法规要求外，我们不会向第三方出售或泄露您的个人信息。</p>' +
        '<h5>四、用户权利</h5>' +
        '<p>4.1 您有权查看自己的个人信息，发现错误可联系管理员修改。</p>' +
        '<p>4.2 您有权注销账号，注销后您的个人信息将被删除（法律法规要求保留的除外）。</p>' +
        '<h5>五、Cookies使用</h5>' +
        '<p>5.1 我们使用Cookies来保持登录状态和改善用户体验。</p>' +
        '<p>5.2 您可以在浏览器中禁用Cookies，但这可能影响部分功能。</p>' +
        '<h5>六、联系我们</h5>' +
        '<p>如您对隐私政策有任何疑问，请联系平台管理员。</p>'
    }
  };

  // 显示协议弹窗
  function showAgreement(type) {
    var modal = document.getElementById('agreementModal');
    var title = document.getElementById('agreementTitle');
    var body = document.getElementById('agreementBody');
    
    if (agreements[type]) {
      title.textContent = agreements[type].title;
      body.innerHTML = agreements[type].content;
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
  }

  // 关闭协议弹窗
  function closeAgreement() {
    var modal = document.getElementById('agreementModal');
    modal.style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  // 点击弹窗外部关闭
  document.addEventListener('click', function(e) {
    var modal = document.getElementById('agreementModal');
    if (e.target === modal) {
      closeAgreement();
    }
  });
  
  // 加载验证码
  var captchaKey = '';
  async function loadCaptcha() {
    try {
      var res = await fetch('/api/auth/captcha');
      var data = await res.json();
      if (data.code === 200) {
        captchaKey = data.data.key;
        var captchaImg = document.getElementById('captchaImg');
        if (captchaImg) {
          captchaImg.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data.data.captcha)));
        }
      }
    } catch (err) {
      console.error('加载验证码失败:', err);
    }
  }
  
  // 页面加载时自动加载验证码
  loadCaptcha();

  // 表单验证增强
  document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('registerForm');
    var agreeCheckbox = document.getElementById('agreeTerms');
    
    if (form && agreeCheckbox) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // 检查是否同意协议
        if (!agreeCheckbox.checked) {
          showToast('请先阅读并同意《用户协议》和《隐私政策》', 'error');
          return;
        }
        
        // 调用原来的注册逻辑
        var username = document.getElementById('username').value.trim();
        var nickname = document.getElementById('nickname').value.trim();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        
        if (!username || !nickname || !password) {
          showToast('请填写所有必填项', 'error');
          return;
        }
        
        if (password !== confirmPassword) {
          showToast('两次输入的密码不一致', 'error');
          return;
        }
        
        if (password.length < 6) {
          showToast('密码至少需要6个字符', 'error');
          return;
        }
        
        // 调用auth.js中的注册函数
        if (typeof register === 'function') {
          register();
        }
      });
    }
  });
  </script>
  <script>
    (function() {
      var defaultSiteName = '嘉二の墙墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      fetch('/api/site-info')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 注册';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
      }
    })();
  </script>
</body>
</html>
