<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘉二の墙墙 - 登录</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="登录嘉二の墙墙校园信息交流平台，开启你的校园社交之旅。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://wall.jay23.cn/login">
  <link rel="stylesheet" href="/css/style.css?v=202605011">
  <link rel="stylesheet" href="/css/responsive.css?v=202605011">
  <link rel="stylesheet" href="/css/mobile-fix.css?v=202605011">
  <style>
    /* 暗色主题适配 */
    [data-theme="dark"] body {
      background: linear-gradient(135deg, #1a1423 0%, #2a1f33 100%);
    }
    [data-theme="dark"] .auth-card {
      background: var(--bg-card);
      box-shadow: 0 8px 32px rgba(255, 107, 157, 0.1);
    }
    [data-theme="dark"] .form-input {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border-color);
      color: var(--text-primary);
    }
    [data-theme="dark"] .form-input::placeholder {
      color: var(--text-light);
    }
    [data-theme="dark"] .auth-title {
      color: var(--text-primary);
    }
    [data-theme="dark"] .auth-subtitle {
      color: var(--text-secondary);
    }
    [data-theme="dark"] .auth-remember {
      color: var(--text-secondary);
    }
    [data-theme="dark"] .auth-link {
      color: var(--text-secondary);
    }
    [data-theme="dark"] .beian-text a {
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <!-- 光晕效果背景 -->
  <div class="page-glow">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
  </div>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">🏠 嘉二の墙墙</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link" data-page="home"><span>🏠</span> 首页</a>
        <a href="/radio" class="nav-link" data-page="radio"><span>🎵</span> 点歌</a>
        <a href="/profile" class="nav-link" data-page="profile"><span>👤</span> 我的</a>
        <a href="/messages.html" class="nav-link" data-page="messages"><span>💌</span> 私信</a>
      </div>
      <div class="nav-auth" id="navAuth">
        <a href="/login" class="btn-login">登录</a>
        <a href="/register" class="btn-register">注册</a>
      </div>
      <div class="nav-user" id="navUser" style="display:none">
        <a href="/profile" class="nav-avatar" id="navAvatar"><img src="" alt=""></a>
        <span class="nav-nickname" id="navNickname"></span>
      </div>
      <button class="theme-switch" id="themeSwitch" title="切换主题" onclick="(function(){var t=document.documentElement.getAttribute('data-theme')==='dark';if(t){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light');this.textContent='🌙'}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');this.textContent='☀️'}})()">🌙</button>
      <button class="nav-mobile-toggle" id="navToggle">☰</button>
    </div>
  </nav>

  <!-- 移动端顶部快捷注册入口 -->
  <div class="mobile-auth-bar">
    <span>还没有账号？</span>
    <a href="/register" class="mobile-quick-register">立即注册 →</a>
  </div>

  <!-- 登录页 -->
  <div class="auth-page">
    <div class="auth-decorations">
      <div class="decor-circle" style="width:300px;height:300px;background:rgba(255,107,107,0.15);top:-80px;right:-60px;"></div>
      <div class="decor-circle" style="width:200px;height:200px;background:rgba(78,205,196,0.15);bottom:-50px;left:-40px;"></div>
      <div class="decor-circle" style="width:150px;height:150px;background:rgba(255,217,61,0.15);top:40%;left:10%;"></div>
    </div>
    <div class="auth-card">
      <div class="auth-emoji">📝</div>
      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-subtitle">登录你的嘉二の墙墙账号</p>
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <input type="text" id="username" class="form-input" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <label class="auth-remember">
          <input type="checkbox" id="rememberMe">
          <span>记住我</span>
        </label>
        <button type="submit" class="btn-login" id="loginBtn">登 录</button>
      </form>
      <div class="auth-link">
        还没有账号？<a href="/register">去注册</a>
      </div>
      <div class="beian-text">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="nofollow">粤ICP备2025514735号-3</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>var currentUser = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || 'null');</script>
  <script>
    (function() {
      var defaultSiteName = '嘉二の墙墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      fetch('/api/site-info')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 登录';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
      }
    })();
  </script>
</body>
</html>
