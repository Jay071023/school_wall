<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFBFE" id="themeColorMeta">
  <title>嘉二の墙墙 - 登录</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <meta name="description" content="登录嘉二の墙墙校园信息交流平台，开启你的校园社交之旅。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://wall.jay23.cn/login">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/mobile-fix.css">
  <link id="theme-520-css" rel="stylesheet" href="/css/520.css" disabled>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #FFF0F5 0%, #FFE4EE 30%, #F0E6FF 70%, #E6F7FF 100%);
      position: relative; overflow: hidden; margin: 0;
    }
    [data-theme="dark"] body {
      background: linear-gradient(135deg, #1a1423 0%, #2a1f33 30%, #1e1a30 70%, #141a2a 100%);
    }

    .kawaii-star {
      position: fixed; pointer-events: none; font-size: 1.2rem;
      opacity: 0.5; animation: kawaiiFloat 6s ease-in-out infinite; z-index: 0;
    }
    .kawaii-star:nth-child(1) { top: 8%; left: 10%; animation-delay: 0s; font-size: 1.5rem; }
    .kawaii-star:nth-child(2) { top: 15%; right: 15%; animation-delay: 1s; }
    .kawaii-star:nth-child(3) { bottom: 20%; left: 8%; animation-delay: 2s; font-size: 1rem; }
    .kawaii-star:nth-child(4) { bottom: 10%; right: 12%; animation-delay: 0.5s; font-size: 1.8rem; }
    .kawaii-star:nth-child(5) { top: 45%; left: 5%; animation-delay: 1.5s; }
    .kawaii-star:nth-child(6) { top: 40%; right: 8%; animation-delay: 2.5s; font-size: 0.9rem; }
    .kawaii-star:nth-child(7) { top: 70%; left: 50%; animation-delay: 3s; font-size: 1.1rem; }
    @keyframes kawaiiFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
      50% { transform: translateY(-15px) rotate(15deg); opacity: 0.7; }
    }
    [data-theme="dark"] .kawaii-star { opacity: 0.25; }

    .login-orb {
      position: fixed; border-radius: 50%; filter: blur(100px);
      pointer-events: none; opacity: 0.3; z-index: 0;
    }
    .login-orb:nth-child(8) {
      width: 350px; height: 350px; background: #FFB6C1;
      top: -120px; right: -80px;
      animation: orbFloat1 12s ease-in-out infinite;
    }
    .login-orb:nth-child(9) {
      width: 280px; height: 280px; background: #DDA0DD;
      bottom: -100px; left: -60px;
      animation: orbFloat2 10s ease-in-out infinite;
    }
    .login-orb:nth-child(10) {
      width: 180px; height: 180px; background: #87CEEB;
      top: 30%; left: 55%;
      animation: orbFloat3 14s ease-in-out infinite;
    }
    [data-theme="dark"] .login-orb:nth-child(8) { background: #8B3A62; }
    [data-theme="dark"] .login-orb:nth-child(9) { background: #553C7B; }
    [data-theme="dark"] .login-orb:nth-child(10) { background: #2C5F7A; }
    @keyframes orbFloat1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 25px) scale(1.08); }
    }
    @keyframes orbFloat2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-20px, -30px) scale(1.12); }
    }
    @keyframes orbFloat3 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
      50% { transform: translate(15px, -15px) scale(1.15); opacity: 0.4; }
    }

    .login-page { 
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; position: relative; z-index: 1;
    }

    .login-card {
      width: 100%; max-width: 400px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 28px; padding: 38px 34px;
      box-shadow: 0 20px 60px rgba(255,107,157,0.12), 0 0 0 1px rgba(255,255,255,0.5) inset;
      position: relative; z-index: 1;
      animation: cardIn 0.5s ease-out;
    }
    [data-theme="dark"] .login-card {
      background: rgba(30,20,40,0.85);
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header { text-align: center; margin-bottom: 28px; }
    .login-header .login-emoji { font-size: 2.5rem; margin-bottom: 10px; display: block; }
    .login-title {
      font-size: 1.35rem; font-weight: 700;
      background: linear-gradient(135deg, #FF6B9D, #A78BFA);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin: 0 0 4px;
    }
    [data-theme="dark"] .login-title {
      background: linear-gradient(135deg, #FF8FB1, #C4A5FF);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-subtitle { font-size: 0.82rem; color: #999; margin: 0; }
    [data-theme="dark"] .login-subtitle { color: rgba(255,255,255,0.4); }

    .form-group { margin-bottom: 14px; }
    .input-wrap {
      display: flex; align-items: center;
      border: 1.5px solid #F0E6FF; border-radius: 14px;
      background: rgba(255,255,255,0.7);
      transition: all 0.25s;
    }
    .input-wrap:focus-within {
      border-color: #D8B4FE;
      box-shadow: 0 0 0 3px rgba(216,180,254,0.15);
      background: #fff;
    }
    [data-theme="dark"] .input-wrap {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.1);
    }
    [data-theme="dark"] .input-wrap:focus-within {
      border-color: rgba(167,139,250,0.4);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.1);
      background: rgba(255,255,255,0.1);
    }
    .input-wrap .input-icon {
      width: 40px; flex-shrink: 0; text-align: center;
      font-size: 1rem; opacity: 0.4; line-height: 1; user-select: none;
    }
    .form-input {
      flex: 1; padding: 13px 14px 13px 6px;
      border: none; background: transparent;
      font-size: 0.938rem; outline: none; font-family: inherit;
      color: #333;
    }
    .form-input::placeholder { color: #ccc; }
    [data-theme="dark"] .form-input { color: #eee; }
    [data-theme="dark"] .form-input::placeholder { color: rgba(255,255,255,0.25); }
    .form-input::placeholder { color: #ccc; }

    .login-captcha-group {
      display: none; gap: 10px; align-items: center; margin-bottom: 14px;
    }
    .login-captcha-group.show { display: flex; }
    .login-captcha-input { flex: 1; }
    .login-captcha-img {
      height: 44px; min-width: 100px; border-radius: 12px; cursor: pointer;
      border: 1.5px solid #F0E6FF; transition: border-color 0.3s;
    }
    .login-captcha-img:hover { border-color: #D8B4FE; }
    [data-theme="dark"] .login-captcha-img { border-color: rgba(255,255,255,0.1); }

    .login-remember {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 18px; font-size: 0.85rem;
      color: #aaa; cursor: pointer; user-select: none;
    }
    .login-remember input[type="checkbox"] { width: 16px; height: 16px; accent-color: #A78BFA; cursor: pointer; }
    [data-theme="dark"] .login-remember { color: rgba(255,255,255,0.4); }

    .login-error {
      display: none; padding: 10px 14px; margin-bottom: 14px;
      background: rgba(255,107,157,0.08);
      border: 1px solid rgba(255,107,157,0.15);
      border-radius: 12px; color: #FF6B9D; font-size: 0.85rem; text-align: center;
    }
    .login-error.show { display: block; }
    [data-theme="dark"] .login-error {
      background: rgba(255,107,157,0.1); color: #FF8FB1;
    }

    .login-btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #FF9A9E, #FAD0C4, #A18CD1);
      background-size: 200% 200%; color: #fff; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: all 0.3s;
      font-family: inherit; letter-spacing: 1px; position: relative;
      overflow: hidden; min-height: 48px;
      animation: gradientShift 4s ease-in-out infinite;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(161,140,209,0.35); }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .login-btn .spinner {
      display: none; width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.6s linear infinite; margin: 0 auto;
    }
    .login-btn.loading .btn-text { display: none; }
    .login-btn.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer { text-align: center; margin-top: 18px; }
    .login-footer a {
      font-size: 0.82rem; color: #ccc; text-decoration: none; transition: color 0.2s;
    }
    .login-footer a:hover { color: #FF6B9D; }

    .login-links { text-align: center; margin-top: 16px; display: flex; justify-content: center; gap: 16px; }
    .login-links a { font-size: 0.82rem; color: #ccc; text-decoration: none; transition: color 0.2s; }
    .login-links a:hover { color: #FF6B9D; }

    @media (max-width: 480px) {
      .login-card { padding: 28px 22px; border-radius: 24px; }
      .login-header .login-emoji { font-size: 2rem; }
      .login-title { font-size: 1.15rem; }
      .login-btn { padding: 12px; font-size: 0.95rem; min-height: 44px; }
      .login-captcha-img { min-width: 80px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="kawaii-star">⭐</div>
  <div class="kawaii-star">🌸</div>
  <div class="kawaii-star">✨</div>
  <div class="kawaii-star">💖</div>
  <div class="kawaii-star">🌟</div>
  <div class="kawaii-star">🦋</div>
  <div class="kawaii-star">🎀</div>
  <div class="login-orb"></div>
  <div class="login-orb"></div>
  <div class="login-orb"></div>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">🏠 嘉二の墙墙</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link" data-page="home"><span>🏠</span> 首页</a>
        <a href="/radio" class="nav-link" data-page="radio"><span>🎵</span> 点歌</a>
        <a href="/profile" class="nav-link" data-page="profile"><span>👤</span> 我的</a>
        <a href="/messages.html" class="nav-link" data-page="messages"><span>💌</span> 私信</a>
      </div>
      <div class="nav-auth" id="navAuth">
        <a href="/login" class="btn-login">登录</a>
        <a href="/register" class="btn-register">注册</a>
      </div>
      <div class="nav-user" id="navUser" style="display:none">
        <a href="/profile" class="nav-avatar" id="navAvatar"><img src="" alt=""></a>
        <span class="nav-nickname" id="navNickname"></span>
      </div>
      <button class="theme-switch" id="themeSwitch" title="切换主题" onclick="(function(){var t=document.documentElement.getAttribute('data-theme')==='dark';if(t){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light');this.textContent='🌙'}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');this.textContent='☀️'}updateThemeColor();})()">🌙</button>
      <button class="nav-mobile-toggle" id="navToggle">☰</button>
    </div>
  </nav>

  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <span class="login-emoji">📝</span>
        <h1 class="login-title">欢迎回来</h1>
        <p class="login-subtitle">登录你的嘉二の墙墙账号 💕</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" class="form-input" placeholder="用户名" autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input type="password" id="password" class="form-input" placeholder="密码" autocomplete="current-password">
          </div>
        </div>
        <div class="login-captcha-group" id="loginCaptchaGroup">
          <input type="text" id="captchaCode" class="form-input login-captcha-input" placeholder="验证码">
          <img id="captchaImg" class="login-captcha-img" src="" alt="验证码" title="刷新" onclick="loadLoginCaptcha()">
        </div>
        <div class="login-error" id="loginError"></div>
        <label class="login-remember">
          <input type="checkbox" id="rememberMe">
          <span>记住我 💫</span>
        </label>
        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">🔓 登 录</span>
          <span class="spinner"></span>
        </button>
      </form>
      <div class="login-links">
        <a href="/register">注册账号</a>
        <a href="/">返回首页</a>
      </div>
      <div class="login-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="nofollow">粤ICP备2025514735号-3</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>var currentUser = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || 'null');</script>
  <script>
    window.loginCaptchaKey = '';
    window.loadLoginCaptcha = async function() {
      try {
        var res = await fetch('/api/auth/captcha');
        var data = await res.json();
        if (data.code === 200) {
          window.loginCaptchaKey = data.data.key;
          document.getElementById('captchaImg').src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data.data.captcha)));
        }
      } catch (err) { console.error('加载验证码失败:', err); }
    }
    fetch('/api/auth/login-status').then(function(r) { return r.json(); }).then(function(d) {
      if (d.code === 200 && d.data.needCaptcha) {
        document.getElementById('loginCaptchaGroup').classList.add('show');
        loadLoginCaptcha();
      }
    }).catch(function() {});
    document.addEventListener('loginCaptchaRequired', function() {
      document.getElementById('loginCaptchaGroup').classList.add('show');
      loadLoginCaptcha();
    });
    document.addEventListener('loginError', function(e) {
      var errDiv = document.getElementById('loginError');
      errDiv.textContent = e.detail;
      errDiv.classList.add('show');
    });
    document.addEventListener('loginLoading', function(e) {
      document.getElementById('loginBtn').classList.toggle('loading', e.detail);
    });
  </script>
  <script>
    (function() {
      var defaultSiteName = '嘉二の墙墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try { var settings = JSON.parse(cachedSettings); applySiteSettings(settings); } catch(e) {}
      }
      fetch('/api/site-info')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 登录';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
        if (settings.special_mode_520) {
          document.body.classList.add('mode-520', 'login-page');
          var themeCss = document.getElementById('theme-520-css');
          if (themeCss) themeCss.disabled = false;
        } else {
          document.body.classList.remove('mode-520', 'login-page');
          var themeCss = document.getElementById('theme-520-css');
          if (themeCss) themeCss.disabled = true;
        }
        var themeColorMeta = document.getElementById('themeColorMeta');
        if (themeColorMeta) {
          var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          themeColorMeta.setAttribute('content', settings.special_mode_520 ? (isDark ? '#2D2438' : '#FF7A9A') : (isDark ? '#1a1423' : '#FAFBFE'));
        }
      }
    })();
  </script>
</body>
