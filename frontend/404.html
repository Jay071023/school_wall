<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <style id="app-boot-style">
    html.app-booting { background: #f7f1e6; }
    html.app-booting body { visibility: hidden; }
  </style>
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("app-booting");
      var released = false;
      var themeReady = false;
      var hardTimeoutId = window.setTimeout(function () { release(true); }, 7000);
      function release(force) {
        if (released || (!themeReady && !force)) return;
        released = true;
        window.clearTimeout(hardTimeoutId);
        root.classList.remove("app-booting");
      }
      window.addEventListener("festival-theme-ready", function () {
        themeReady = true;
        release(false);
      }, { once: true });
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFBFE" id="themeColorMeta">
  <title>示例校园墙 - 页面未找到</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/js/theme-mode.js" defer></script>
<meta name="description" content="页面未找到 - 示例校园墙校园信息交流平台">
  <meta name="keywords" content="404,页面未找到,示例校园,校园墙">
  <script>(function(){var bp=document.createElement('script');var curProtocol=window.location.protocol.split(':')[0];if(curProtocol==='https'){bp.src='https://zz.bdstatic.com/linksubmit/push.js'}else{bp.src='http://push.zhanzhang.baidu.com/push.js'}var s=document.getElementsByTagName('script')[0];s.parentNode.insertBefore(bp,s)})();</script>
</head>
<body class="error-page">
  <!-- 404页面 -->
  <div class="error-page">
    <div class="error-decorations">
      <div class="decor-circle" style="width:250px;height:250px;background:rgba(255,107,107,0.12);top:-60px;right:-40px;"></div>
      <div class="decor-circle" style="width:180px;height:180px;background:rgba(78,205,196,0.12);bottom:-40px;left:-30px;"></div>
      <div class="decor-circle" style="width:120px;height:120px;background:rgba(255,217,61,0.12);top:50%;left:15%;"></div>
    </div>
    <div class="error-content">
      <div class="error-illustration">
        <div class="error-404-number">404</div>
      </div>
      <h1 class="error-title">页面走丢了~</h1>
      <p class="error-subtitle">你访问的页面不存在或已被删除</p>
      <a href="/" class="btn-home">🏠 返回首页</a>
    </div>
  </div>
  <script>
    (function() {
      var defaultSiteName = '示例校园墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      var siteInfoRequest = window.CampusWallSiteInfoPromise;
      if (!siteInfoRequest) {
        siteInfoRequest = fetch('/api/site-info', { credentials: 'same-origin', cache: 'no-store' })
          .then(function(res) { return res.ok ? res.json() : null; })
          .catch(function() { return null; });
        window.CampusWallSiteInfoPromise = siteInfoRequest;
      }
      siteInfoRequest
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 页面未找到';
      }
    })();
  </script>
  <footer class="footer">
    <p>&copy; 2026 示例校园墙 All Rights Reserved</p>
    <p><a href="https://beian.miit.gov.cn/" target="_blank" rel="nofollow">粤ICP备2025514735号-3</a></p>
  </footer>
</body>
</html>
