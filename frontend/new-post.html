</head>
<body>

  <!-- 导航栏 -->

        <a href="/radio" class="nav-link" data-page="radio"><span>🎵</span> 点歌</a>
        <a href="/profile" class="nav-link" data-page="profile"><span>👤</span> 我的</a>
        <a href="/messages.html" class="nav-link" data-page="messages"><span>💌</span> 私信</a>
      </div>

        <a href="/login" class="btn-login">登录</a>
        <a href="/register" class="btn-register">注册</a>
      </div>
      <div class="nav-user" id="navUser" style="display:none">
        <a href="/profile" class="nav-avatar" id="navAvatar"><img src="" alt=""></a>

      </div>
      <button class="theme-switch" id="themeSwitch" title="切换主题" onclick="(function(){var t=document.documentElement.getAttribute('data-theme')==='dark';if(t){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light');this.textContent='🌙'}else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');this.textContent='☀️'}updateThemeColor();})()">🌙</button>

  <!-- 主内容区 -->
  <div class="main-content">
    <div class="post-form-card">
      <div class="post-form-header">
        <h2 class="post-form-title">发布新动态</h2>
        <p class="post-form-subtitle">分享你的想法...</p>
      </div>
      <form class="post-form" id="postForm">
        <!-- 标题 -->
        <div class="form-group">
          <label class="form-label">标题 <span class="optional-tag">选填</span></label>
          <input type="text" id="postTitle" class="form-input" placeholder="标题（可选）">
        </div>
        <!-- 内容 -->
        <div class="form-group">
          <label class="form-label">内容 <span class="required-tag">必填</span></label>
          <div class="editor-toolbar">
            <button type="button" class="editor-btn" title="粗体" onclick="insertFormat('bold')"><b>B</b></button>
            <button type="button" class="editor-btn" title="斜体" onclick="insertFormat('italic')"><i>I</i></button>
            <button type="button" class="editor-btn" title="插入表情" onclick="showEmojiPicker()">😀</button>
            <div class="word-counter"><span id="charCount">0</span> / 2000</div>
          </div>
          <textarea id="postContent" class="form-textarea" placeholder="说点什么..." rows="4" maxlength="2000"></textarea>
          <div class="emoji-picker" id="emojiPicker"></div>
        </div>
        <!-- 图片上传 -->
        <div class="form-group">
          <label class="form-label">图片</label>
          <div class="image-upload-area" id="uploadArea">
            <div class="upload-placeholder" id="uploadPlaceholder">
              <div class="upload-icon">📷</div>
              <div class="upload-text">点击或拖拽上传图片</div>
              <div class="upload-hint">最多9张，支持JPG/PNG/GIF</div>
            </div>
            <input type="file" class="upload-input" id="fileInput" multiple accept="image/*">
          </div>
          <div class="image-preview-list" id="imagePreviewList"></div>
        </div>
        <!-- 分类选择 -->
        <div class="form-group">
          <label class="form-label">分类 <span class="required-tag">必填</span></label>
          <div class="category-tags" id="categoryTags">
            <span class="category-tag selected" data-value="daily">日常</span>
            <span class="category-tag" data-value="confession">表白</span>
            <span class="category-tag" data-value="help">求助</span>
            <span class="category-tag" data-value="secondhand">二手</span>
            <span class="category-tag" data-value="lost_found">失物招领</span>
            <span class="category-tag" data-value="poll">投票</span>
            <span class="category-tag" data-value="club">社团</span>
            <span class="category-tag" data-value="other">其他</span>
          </div>
        </div>
        <!-- 联系方式（失物招领用） -->
        <div class="form-group" id="contactGroup" style="display:none;">
          <label class="form-label">联系方式 <span class="optional-tag">选填，失物招领用</span></label>
          <input type="text" class="form-input" id="contactInput" placeholder="微信号 / QQ / 手机号" maxlength="50">
        </div>
        <!-- 投票选项 -->
        <div class="form-group" id="pollGroup" style="display:none;">
          <label class="form-label">投票选项 <span class="required-tag">至少2项</span></label>
          <div id="pollOptionsContainer">
            <div class="poll-option-row"><input type="text" class="form-input poll-option-input" placeholder="选项 1" maxlength="100"></div>
            <div class="poll-option-row"><input type="text" class="form-input poll-option-input" placeholder="选项 2" maxlength="100"></div>
          </div>
          <button type="button" class="btn btn-sm btn-ghost" onclick="addPollOption()" style="margin-top:8px;">+ 添加选项</button>
          <div style="margin-top:8px;">
            <label class="poll-multiple-label"><input type="checkbox" id="pollMultiple"> 允许多选</label>
          </div>
        </div>
        <div class="toggle-switch-wrapper" id="anonymousOption" style="display: none;">
          <span>匿名发布</span>
          <label class="toggle-switch">
            <input type="checkbox" id="anonymousToggle">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-hint">开启后将以匿名身份发布</span>
        </div>
        <!-- 提交按钮 -->
        <div class="form-actions">
          <button type="button" class="btn-preview" id="previewBtn" onclick="showPreview()">预览效果</button>
          <button type="button" class="btn-save-draft" id="saveDraftBtn" onclick="saveDraft()">保存草稿</button>
          <button type="submit" class="btn-publish" id="publishBtn">发布动态</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 预览弹窗 -->
  <div class="preview-modal" id="previewModal">
    <div class="preview-modal-content">
      <div class="preview-modal-header">
        <span>内容预览</span>
        <button class="preview-modal-close" onclick="closePreview()">✕</button>
      </div>
      <div class="preview-modal-body" id="previewContent"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/post.js"></script>
  <script>var currentUser = JSON.parse(localStorage.getItem('user') || sessionStorage.getItem('user') || 'null');</script>
  <script>
    (function() {
      var defaultSiteName = '嘉二の墙墙';
      var cachedSettings = localStorage.getItem('siteSettings');
      if (cachedSettings) {
        try {
          var settings = JSON.parse(cachedSettings);
          applySiteSettings(settings);
        } catch(e) {}
      }
      fetch('/api/site-info')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.code === 200 && data.data) {
            var settings = data.data;
            localStorage.setItem('siteSettings', JSON.stringify(settings));
            applySiteSettings(settings);
          }
        })
        .catch(function() {});
      function applySiteSettings(settings) {
        var siteName = settings.site_name || defaultSiteName;
        document.title = siteName + ' - 发布动态';
        var navLogo = document.querySelector('.nav-logo');
        if (navLogo) navLogo.textContent = '🏠 ' + siteName;
        // 520特别模式
        if (settings.special_mode_520) {
          document.body.classList.add('mode-520');
          var themeCss = document.getElementById('theme-520-css');
          if (themeCss) themeCss.disabled = false;
        } else {
          document.body.classList.remove('mode-520');
          var themeCss = document.getElementById('theme-520-css');
          if (themeCss) themeCss.disabled = true;
        }
        var themeColorMeta = document.getElementById('themeColorMeta');
        if (themeColorMeta) {
          var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          themeColorMeta.setAttribute('content', settings.special_mode_520 ? (isDark ? '#2D2438' : '#FF7A9A') : (isDark ? '#1a1423' : '#FAFBFE'));
        }
      }
    })();
  </script>

    .preview-modal-content {
      background: #fff;
      border-radius: 20px;

      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .preview-modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .preview-modal-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #999;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
    }
    .preview-modal-close:hover {
      background: #f5f5f5;
      color: #333;
    }
    .preview-modal-body { padding: 24px; }
    .preview-category-tag {

      padding: 6px 14px;

      font-size: 0.8rem;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #FF6B9D, #FF8E53);

      font-weight: 500;
    }
    .preview-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #333;
    }
    .preview-content {
      font-size: 1rem;
      line-height: 1.8;
      color: #495057;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .preview-images {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }
    .preview-images img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .preview-images img:hover {
      transform: scale(1.03);
    }
    @media (max-width: 768px) {
      .post-form-card { padding: 20px !important; }
      .form-actions { flex-direction: column; }
      .btn-preview, .btn-save-draft, .btn-publish { width: 100%; }
      .btn-publish { margin-left: 0; }
      .form-group { margin-bottom: 20px !important; }

    }
